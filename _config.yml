# Site Settings
title: "Ben Shindel"
description: "Materials scientist and forecaster. Research on carbon capture and water remediation, forecasting, and writing on science and AI."
tagline: "Materials scientist & forecaster"
url: "https://www.benshindel.com"  # Canonical URL (used for link previews, sitemap, feed)
baseurl: ""  # Leave empty if your site is deployed at the root

# Author Information
author:
  name: "Ben Shindel"
  email: "benshindel@gmail.com"
  twitter_username: "benshindel"
  github_username: "benshindel"

# Build Settings
markdown: kramdown  # Default Markdown parser
theme: minima       # Default Jekyll theme
permalink: pretty   # Pretty URLs for pages (no .html extensions)

# Plugins
plugins:
  - jekyll-feed   # Generate an RSS feed
  - jekyll-seo-tag  # Add SEO meta tags
  - jekyll-sitemap  # Generate a sitemap.xml file

# Defaults
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-card.jpg
  - scope:
      path: ""  # Apply to all files
      type: "posts"  # Only apply to posts
      values:
      layout: "default"  # Use the default layout

# Navigation Links


# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  recipes:
    output: true
    permalink: /cookbook/:title/

# Exclusions
exclude:
  - README.md  # Exclude README file from the build

# Miscellaneous
paginate: 5  # Number of posts per page (if using pagination)
paginate_path: "/page:num/"  # Pagination path

# Custom Variables
custom_variables:
  dark_mode_enabled: true

# Favicon
favicon: /assets/images/favicon.png
