<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body class="sub cookbook">
<div class="table">
  {% include cloth.html %}
  <div class="wrap">
    {% include masthead.html %}
    <main class="page recipe-page">
      <div class="sheet">
      <a href="{{ '/cookbook/' | relative_url }}" class="recipe-back">&larr; Cookbook</a>
      <h1 class="page-title">{{ page.title }}</h1>
      <div class="recipe-content">
        {{ content }}
      </div>
      {% if page.source %}
      <div class="recipe-source">
        {% if page.source_url %}
          Source: <a href="{{ page.source_url }}" target="_blank" rel="noopener">{{ page.source }}</a>
        {% else %}
          Source: {{ page.source }}
        {% endif %}
      </div>
      {% endif %}
      </div>
    </main>
    {% include colophon.html %}
  </div>
</div>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
