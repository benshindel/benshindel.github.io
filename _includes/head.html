<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){var r=document.documentElement,t=null;try{t=localStorage.getItem('theme');}catch(e){}
if(t==='dark'||t==='light')r.dataset.theme=t;
/* night is decided before the first paint, so a page arrives already lamplit (no fade-in when navigating) */
r.dataset.night=(t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))?'1':'0';})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
