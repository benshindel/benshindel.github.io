<header class="masthead">
  {% if include.home %}<h1>{% endif %}
  <a class="nameplate" href="{{ '/' | relative_url }}" aria-label="Ben Shindel, home">
    <img src="{{ '/assets/images/site/nameplate.webp' | relative_url }}" alt="" width="777" height="158">
  </a>
  {% if include.home %}</h1>{% endif %}
  <button class="lamp" id="lamp" type="button" aria-label="Light the lamp (switch to night)">
    <span class="halo"></span>
    <img class="lamp-body" src="{{ '/assets/images/site/lamp.webp' | relative_url }}" alt="" width="398" height="232">
    <img class="flame" src="{{ '/assets/images/site/flame.webp' | relative_url }}" alt="" width="200" height="320">
  </button>
</header>
